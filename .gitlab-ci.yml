stages:
  - build
  - package
  - deploy-dev
  - deploy-uat
  - deploy-perf
  - deploy-prod
  - deploy-hotfix

build-jar:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  script:
    - mvn -B -s ci_settings.xml deploy -DskipTests

build-image:
  stage: package
  image: docker:27
  needs:
    - build-jar
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --provenance=false --sbom=false -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

deploy-dev:
  stage: deploy-dev
  image:
    name: alpine/helm:3.16.2
    entrypoint: [""]
  needs:
    - build-image
  script:
    - export KUBECONFIG=$KUBE_CONFIG
    - helm upgrade --install app-dev ./helm -n dev -f ./helm/values/values-dev.yaml --set image.repository="$CI_REGISTRY_IMAGE" --set image.tag="$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^feature\//

deploy-uat:
  stage: deploy-uat
  image:
    name: alpine/helm:3.16.2
    entrypoint: [""]
  needs:
    - deploy-dev
  script:
    - export KUBECONFIG=$KUBE_CONFIG
    - helm upgrade --install app-uat ./helm -n uat -f ./helm/values/values-uat.yaml --set image.repository="$CI_REGISTRY_IMAGE" --set image.tag="$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^feature\//

deploy-perf:
  stage: deploy-perf
  image:
    name: alpine/helm:3.16.2
    entrypoint: [""]
  needs:
    - build-image
  script:
    - export KUBECONFIG=$KUBE_CONFIG
    - helm upgrade --install app-perf ./helm -n perf -f ./helm/values/values-perf.yaml --set image.repository="$CI_REGISTRY_IMAGE" --set image.tag="$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^release\//
      when: manual

deploy-prod:
  stage: deploy-prod
  image:
    name: alpine/helm:3.16.2
    entrypoint: [""]
  needs:
    - build-image
  script:
    - export KUBECONFIG=$KUBE_CONFIG
    - helm upgrade --install app-prod ./helm -n prod -f ./helm/values/values-prod.yaml --set image.repository="$CI_REGISTRY_IMAGE" --set image.tag="$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^release\//
      when: manual
    - if: $CI_COMMIT_BRANCH =~ /^hotfix\//
      when: manual

deploy-hotfix:
  stage: deploy-hotfix
  image:
    name: alpine/helm:3.16.2
    entrypoint: [""]
  needs:
    - build-image
  script:
    - export KUBECONFIG=$KUBE_CONFIG
    - helm upgrade --install app-hotfix ./helm -n hotfix -f ./helm/values/values-hotfix.yaml --set image.repository="$CI_REGISTRY_IMAGE" --set image.tag="$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^hotfix\//
      when: manual